<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>mri2mesh 워크벤치</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; background: #111; color: #eee;
         height: 100vh; display: flex; overflow: hidden; }

  /* ---------- 캔버스(항상 존재하는 3D 레이어) ---------- */
  #canvas { position: fixed; inset: 0; z-index: 0; }

  /* ---------- 사이드바 ---------- */
  #sidebar { position: relative; z-index: 1; width: 280px; flex: 0 0 280px; background: #181818;
             border-right: 1px solid #2a2a2a; display: flex; flex-direction: column; }
  #sidebar header { padding: 14px 16px; border-bottom: 1px solid #2a2a2a;
                    display: flex; align-items: center; justify-content: space-between; }
  #sidebar header h1 { font-size: 16px; margin: 0; font-weight: 600; letter-spacing: .3px; }
  .new-btn { background: #2d6cdf; color: #fff; border: 0; border-radius: 6px;
             padding: 6px 10px; font-size: 12px; cursor: pointer; }
  #joblist { overflow-y: auto; flex: 1; padding: 8px; }
  .job { position: relative; padding: 10px 12px; padding-right: 52px; border-radius: 8px;
         margin-bottom: 6px; cursor: pointer; border: 1px solid transparent; }
  .job:hover { background: #202020; }
  .job.active { background: #22314f; border-color: #2d6cdf; }
  .job .name { font-size: 15px; margin-bottom: 4px; }
  .job .jid { font-size: 12px; color: #8a93a0; font-family: monospace; margin-bottom: 6px;
              user-select: all; }
  .job .row { display: flex; align-items: center; gap: 8px; }
  .job-actions { position: absolute; top: 8px; right: 8px; display: flex; gap: 2px;
                 align-items: center; }
  .job-del { background: transparent; border: 0; color: #888; cursor: pointer;
             font-size: 16px; line-height: 1; padding: 2px 4px; border-radius: 4px; }
  .job-del:hover { color: #f87171; background: #2a1414; }
  .job-info { background: transparent; border: 0; color: #8ab; cursor: pointer;
              font-size: 14px; line-height: 1; padding: 2px 4px; border-radius: 4px; }
  .job-info:hover { color: #38bdf8; background: #0e2a3a; }
  .chip { font-size: 12px; padding: 3px 9px; border-radius: 10px; font-weight: 600; }
  .chip.done   { background: #14361f; color: #4ade80; }
  .chip.run    { background: #3a2e0e; color: #fbbf24; }
  .chip.await  { background: #0e2a3a; color: #38bdf8; }
  .chip.err    { background: #3a1414; color: #f87171; }
  .bar { height: 4px; background: #2a2a2a; border-radius: 2px; margin-top: 7px; overflow: hidden; }
  .bar > i { display: block; height: 100%; background: #fbbf24; }

  /* ---------- 메인 ---------- */
  /* pointer-events:none 으로 빈 영역 클릭·드래그를 뒤의 캔버스(OrbitControls)로
     통과시킨다. 실제 UI(패널·뷰어패널)만 auto로 되살려 클릭을 받는다. 이게 없으면
     투명한 #main 이 전 포인터 이벤트를 먹어 3D 회전이 안 된다. */
  #main { position: relative; z-index: 1; flex: 1; display: flex; flex-direction: column;
          pointer-events: none; }

  /* 상태 패널 공통 */
  .panel { margin: auto; width: 560px; max-width: 90%; pointer-events: auto; }
  .panel h2 { font-size: 16px; font-weight: 600; margin: 0 0 4px; }
  .panel .sub { color: #888; font-size: 12px; margin-bottom: 18px; }

  /* 시리즈 선택 */
  .series { border: 1px solid #2a2a2a; border-radius: 10px; padding: 14px 16px; margin-bottom: 10px;
            display: flex; gap: 12px; align-items: flex-start; cursor: pointer; }
  .series:hover { border-color: #3a3a3a; }
  .series.sel { border-color: #2d6cdf; background: #16233c; }
  .series input { margin-top: 3px; }
  .series .meta { flex: 1; }
  .series .title { font-size: 14px; margin-bottom: 4px; }
  .series .facts { font-size: 12px; color: #9aa; font-family: monospace; }
  .series .reasons { font-size: 11px; color: #6b8; margin-top: 6px; }
  .series .rank { font-size: 10px; color: #fbbf24; border: 1px solid #3a2e0e; border-radius: 6px;
                  padding: 2px 6px; align-self: flex-start; }
  .primary { background: #2d6cdf; color: #fff; border: 0; border-radius: 8px;
             padding: 10px 18px; font-size: 13px; cursor: pointer; margin-top: 8px; }

  /* 진행률 */
  .steps { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; }
  .step { display: flex; align-items: center; gap: 10px; font-size: 13px; }
  .dot { width: 18px; height: 18px; border-radius: 50%; flex: 0 0 18px;
         display: grid; place-items: center; font-size: 10px; }
  .dot.ok  { background: #14361f; color: #4ade80; }
  .dot.now { background: #3a2e0e; color: #fbbf24; animation: dotpulse 1.2s ease-in-out infinite; }
  .dot.queued { background: #0e2a3a; color: #38bdf8; animation: dotpulse-wait 1.2s ease-in-out infinite; }
  .dot.wait{ background: #222; color: #555; }
  @keyframes dotpulse { 0%,100% { box-shadow: 0 0 0 0 rgba(251,191,36,.5); }
                        50% { box-shadow: 0 0 0 6px rgba(251,191,36,0); } }
  @keyframes dotpulse-wait { 0%,100% { box-shadow: 0 0 0 0 rgba(56,189,248,.5); }
                             50% { box-shadow: 0 0 0 6px rgba(56,189,248,0); } }
  .step-time { font-family: monospace; font-size: 12px; color: #fbbf24; }
  .total-time { font-family: monospace; color: #9aa; }
  .bigbar { height: 6px; background: #2a2a2a; border-radius: 3px; margin-top: 24px; overflow: hidden; }
  .bigbar > i { display: block; height: 100%; width: 0%; background: #fbbf24; }

  /* 뷰어 패널 */
  #vpanel { position: absolute; top: 12px; left: 12px; background: rgba(0,0,0,.55);
            padding: 12px; border-radius: 8px; font-size: 12px; width: 300px;
            max-height: calc(100vh - 24px); overflow-y: auto; pointer-events: auto; }
  #vpanel label { display: block; margin: 3px 0; }
  #metrics { font-family: monospace; font-size: 11px; color: #8ab; margin-top: 8px;
             white-space: pre; }
  #vpanel .slider-row { display: block; margin-top: 8px; font-size: 12px; }
  #vpanel #bigbang { width: 100%; margin-top: 4px; }
  #vpanel #preset { width: 100%; margin-top: 4px; background: #111; color: #eee;
                    border: 1px solid #333; border-radius: 5px; font-size: 12px; }
  .opt-subtitle { font-size: 11px; color: #99a; margin: 10px 0 4px; font-weight: 600; }
  #groups label { display: block; margin: 3px 0; font-size: 12px; }

  /* 변형 범례 (번호 → 옵션 요약) */
  #variant-legend .leg-row { display: flex; gap: 8px; align-items: flex-start; margin: 5px 0; }
  .leg-del { flex: 0 0 auto; margin-left: auto; background: transparent; border: 0; color: #866;
             cursor: pointer; font-size: 15px; line-height: 1; padding: 0 2px; border-radius: 4px; }
  .leg-del:hover { color: #f87171; background: #2a1414; }
  .leg-n { flex: 0 0 auto; min-width: 20px; height: 20px; border-radius: 6px;
           background: #22314f; color: #cfe0ff; border: 1px solid #2d6cdf;
           font-size: 12px; font-weight: 600; text-align: center; line-height: 20px; }
  .leg-s { font-size: 11px; color: #9fb0c0; line-height: 1.4; }

  /* 하단 변형 토글 바 */
  #variant-bar { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%);
                 display: none; gap: 6px; z-index: 5; pointer-events: auto;
                 background: rgba(0,0,0,.55); padding: 8px 10px; border-radius: 10px; }
  .vbtn { min-width: 34px; height: 34px; border-radius: 8px; border: 1px solid #333;
          background: #1a1a1a; color: #778; font-size: 14px; font-weight: 600; cursor: pointer; }
  .vbtn:hover { border-color: #3a4a6a; }
  .vbtn.on { background: #22314f; border-color: #2d6cdf; color: #cfe0ff; }
  #mesh-options { margin-top: 10px; border-top: 1px solid #333; padding-top: 10px; }
  .opt-title { font-size: 12px; font-weight: 600; margin-bottom: 8px; color: #cdd; }
  .gen-actions { display: flex; gap: 6px; margin-top: 8px; }
  .gen-actions .primary, .gen-actions .ghost { margin-top: 0; padding: 8px 10px; font-size: 12px; }
  #queue-list { margin-top: 6px; display: flex; flex-direction: column; gap: 4px; }
  .queue-chip { display: flex; gap: 6px; align-items: flex-start; font-size: 11px;
                color: #9fb0c0; background: #16233c; border: 1px solid #24406a;
                border-radius: 6px; padding: 4px 6px; }
  .queue-chip button { margin-left: auto; background: transparent; border: 0; color: #97a;
                       cursor: pointer; font-size: 13px; line-height: 1; }
  .queue-chip button:hover { color: #f87171; }

  /* 옵션 폼 (options.js buildOptionsForm) — 시리즈 화면·뷰어패널 공용 */
  .mesh-opts { display: flex; flex-direction: column; gap: 12px; }
  .opt-axis { display: flex; flex-direction: column; gap: 4px; }
  .opt-head { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .opt-label { font-size: 12px; font-weight: 600; color: #dde; flex: 1 0 auto; }
  .opt-unit { font-size: 11px; color: #789; }
  .opt-head select, .opt-head input { background: #111; color: #eee; border: 1px solid #333;
    border-radius: 5px; font-size: 12px; padding: 3px 5px; }
  .opt-head input[type=number] { width: 62px; }
  .opt-help { font-size: 11px; color: #8a929c; line-height: 1.45; }

  /* 모달 */
  #overlay { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: none;
             place-items: center; z-index: 10; }
  #overlay.on { display: grid; }

  /* DICOM 메타 info 패널 */
  #dicom-info-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.6);
                        display: none; place-items: center; z-index: 20; }
  #dicom-info-overlay.on { display: grid; }
  #dicom-info { background: #1a1a1a; border: 1px solid #333; border-radius: 12px;
                width: 620px; max-width: 92%; max-height: 82vh; overflow: auto;
                padding: 20px; font-size: 12px; }
  #dicom-info h3 { margin: 0 0 10px; font-size: 15px; }
  #dicom-info .kv { font-family: monospace; font-size: 11px; white-space: pre-wrap;
                    color: #bcd; }
  #dicom-info .removed { color: #f7a; }
  #modal { background: #1a1a1a; border: 1px solid #333; border-radius: 12px; width: 440px;
           max-width: 90%; padding: 22px; }
  #modal h3 { margin: 0 0 14px; font-size: 15px; }
  #name { width: 100%; background: #111; color: #eee; border: 1px solid #333; border-radius: 8px;
          padding: 8px 10px; font-size: 13px; margin-bottom: 12px; }
  .drop { border: 2px dashed #3a3a3a; border-radius: 10px; padding: 34px; text-align: center;
          color: #888; font-size: 13px; }
  .drop b { color: #ccc; }
  .drop:focus-visible { outline: 2px solid #2d6cdf; outline-offset: 3px; }
  .drop-status { color: #38bdf8; font-size: 11px; margin-top: 10px; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
  .ghost { background: transparent; color: #aaa; border: 1px solid #333; border-radius: 8px;
           padding: 8px 14px; cursor: pointer; }
  button:disabled { cursor: wait; opacity: .55; }

  /* ---------- 에셋 비교 모드 ---------- */
  /* 가운데 정렬 클러스터 — 좌드롭다운·정규화·우드롭다운. 좌측 vpanel과 겹치지 않게
     left:300px 대신 화면 중앙에 둔다(분할선 근처에 컨트롤을 모은다). */
  #scissor-divider { position: fixed; top: 0; bottom: 0; left: 50%; width: 2px;
                     transform: translateX(-1px); background: rgba(255,255,255,.20);
                     z-index: 4; pointer-events: none; display: none; }
  #compare-bar { position: fixed; top: 12px; left: 50%; transform: translateX(-50%); z-index: 6;
                 display: flex; gap: 12px; align-items: center; pointer-events: auto; }
  .cmp-pane { display: flex; gap: 6px; background: rgba(0,0,0,.55); padding: 8px; border-radius: 8px; }
  .cmp-pane select { background: #111; color: #eee; border: 1px solid #333; border-radius: 5px;
                     font-size: 12px; max-width: 160px; }
  #normalize-wrap { background: rgba(0,0,0,.55); padding: 8px 12px; border-radius: 8px;
                    font-size: 12px; pointer-events: auto; align-self: center; }
  .new-btn.active-mode { background: #2d6cdf !important; }
</style>
<script type="importmap">
{ "imports": {
  "three": "/static/vendor/three.module.js",
  "three/addons/": "/static/vendor/addons/"
} }
</script>
</head>
<body>

<canvas id="canvas"></canvas>

<!-- ============ 사이드바 ============ -->
<aside id="sidebar">
  <header>
    <h1>mri2mesh</h1>
    <button id="new-job" class="new-btn">+ 새 작업</button>
    <button id="mode-compare" class="new-btn" style="background:#374151">에셋 비교</button>
  </header>
  <div id="joblist"></div>
</aside>

<!-- ============ 메인 (상태별로 app.js가 하나만 보이게 토글) ============ -->
<div id="main">
  <div id="stage-empty" class="panel">왼쪽에서 작업을 고르거나 새로 만드세요.</div>
  <div id="stage-select" class="panel" style="display:none"></div>
  <div id="stage-progress" class="panel" style="display:none"></div>
  <div id="stage-error" class="panel" style="display:none"></div>

  <div id="scissor-divider"></div>

  <div id="compare-bar" style="display:none">
    <div class="cmp-pane" data-side="L">
      <select class="cmp-job"></select><select class="cmp-variant"></select>
    </div>
    <label id="normalize-wrap"><input type="checkbox" id="normalize"> 크기 정규화</label>
    <div class="cmp-pane" data-side="R">
      <select class="cmp-job"></select><select class="cmp-variant"></select>
    </div>
  </div>

  <div id="vpanel" style="display:none">
    <div class="opt-title">변형 (옵션별 산출)</div>
    <div id="variant-legend"></div>
    <div class="opt-title" style="margin-top:12px">표시</div>
    <label><input type="checkbox" id="transparent"> 반투명 셸</label>
    <label class="slider-row">빅뱅 (explode)
      <input type="range" id="bigbang" min="0" max="1" step="0.02" value="0">
    </label>
    <label class="slider-row">조건 프리셋 (영역 하이라이트)
      <select id="preset"><option value="">없음</option></select>
    </label>
    <div class="opt-subtitle">영역 (group / side)</div>
    <div id="groups"></div>
    <div id="metrics"></div>
    <div id="mesh-options">
      <div class="opt-title">비교 변형 생성</div>
      <div id="vpanel-opts"></div>
      <div class="gen-actions">
        <button id="gen-variant" class="primary">변형 생성</button>
        <button id="queue-add" class="ghost">＋ 큐에 추가</button>
      </div>
      <div id="queue-list"></div>
      <button id="gen-batch" class="primary" style="display:none;margin-top:6px">큐 일괄 생성</button>
      <div id="gen-status" class="sub"></div>
    </div>
  </div>
</div>

<!-- ============ 하단 변형 토글 바 (1 2 3 … on/off) ============ -->
<div id="variant-bar"></div>

<!-- ============ 업로드 모달 ============ -->
<div id="overlay">
  <div id="modal">
    <h3>새 작업 — MRI 업로드</h3>
    <input id="name" type="text" placeholder="작업 이름(선택)">
    <div id="drop" class="drop" role="button" tabindex="0"
         aria-describedby="drop-help drop-status">
      <b>DICOM 폴더 / ZIP / NIfTI</b> 드롭<br>
      <span id="drop-help" style="font-size:11px">클릭: ZIP·NIfTI 파일 선택 · 폴더: 드롭</span>
      <div id="drop-status" class="drop-status" role="status" aria-live="polite">선택된 입력 없음</div>
    </div>
    <input id="file-input" type="file" accept=".zip,.nii,.gz,application/zip,application/gzip"
           style="display:none">
    <div class="modal-actions">
      <button id="upload-cancel" class="ghost">취소</button>
      <button id="upload-go" class="primary" style="margin-top:0">업로드</button>
    </div>
  </div>
</div>

<!-- ============ DICOM 메타 info 오버레이 ============ -->
<div id="dicom-info-overlay">
  <div id="dicom-info"></div>
</div>

<script type="module" src="/static/app.js"></script>
</body>
</html>
