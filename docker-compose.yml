# 로컬 단독 워크벤치 (스펙 §5.1, §11). 노출하지 않는다.
services:
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    ports:
      - "127.0.0.1:${WEB_PORT:-8000}:8000"
    environment:
      FASTSURFER_IMAGE: ${FASTSURFER_IMAGE}
      FASTSURFER_THREADS: ${FASTSURFER_THREADS:-8}
      # 동시 세그멘테이션 상한(GPU 경합 방지). 기본 2.
      MRI2MESH_MAX_CONCURRENT_SEG: ${MAX_CONCURRENT_SEG:-2}
      MRI2MESH_JOBS_ROOT: /work/jobs
      # 형제 FastSurfer 컨테이너의 -v 인자에 쓸 호스트 경로 (Task 1 to_host_path).
      # 도커 데몬은 호스트에 있어 api 내부의 /work/jobs를 모른다.
      MRI2MESH_HOST_JOBS_ROOT: ${OUTPUT_DIR}
    volumes:
      # 형제 FastSurfer 컨테이너를 띄우기 위한 docker socket (스펙 §5.1)
      - /var/run/docker.sock:/var/run/docker.sock
      # 잡 작업 폴더 — 호스트 OUTPUT_DIR에 바인드
      - ${OUTPUT_DIR}:/work/jobs
      # dev 편의: 정적 프론트(html/js/css)를 호스트에서 바인드해 UI 수정이
      # --build 없이 브라우저 새로고침만으로 반영되게 한다. static은 실행 로직이
      # 아니라 서빙 파일이라 안전하다. 원치 않으면 이 줄만 지우면 이미지에
      # 구워진 사본(api.Dockerfile COPY)이 그대로 쓰인다.
      - ./mri2mesh/web/static:/app/mri2mesh/web/static:ro
    # GPU는 api가 아니라 형제 FastSurfer 컨테이너가 docker run --gpus로 잡는다
